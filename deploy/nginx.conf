# nginx in front of the relay (same server). Replace stream.example.com and the
# certificate paths. Media itself (UDP/TCP 8189) goes straight to MediaMTX and
# does not pass through nginx.
#
# Matching .env:
#   NODE_ENV=production
#   MEDIAMTX_PUBLIC_WEBRTC_URL=https://stream.example.com/webrtc
#   MEDIAMTX_PUBLIC_HLS_URL=https://stream.example.com/hls
# and for MediaMTX: MTX_WEBRTCADDITIONALHOSTS=<server public IP>

# Slow down password guessing on the admin login (on top of the app's lockout).
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

server {
  listen 80;
  server_name stream.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name stream.example.com;

  ssl_certificate     /etc/letsencrypt/live/stream.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stream.example.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # Real client IP for the app and MediaMTX (both trust only 127.0.0.1).
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # MediaMTX's auth hook must never be reachable from outside.
  location /internal/ {
    return 404;
  }

  # Optional: only allow the dashboard from your office / VPN.
  # location /admin {
  #   allow 203.0.113.10;
  #   deny all;
  #   proxy_pass http://127.0.0.1:4010;
  # }

  location = /admin/login {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:4010;
  }

  # App: /watch, /api/video, /admin, /health
  location / {
    proxy_pass http://127.0.0.1:4010;
  }

  # WebRTC signalling (WHEP). The prefix is stripped; Location headers in
  # MediaMTX answers are rewritten back under /webrtc/.
  location /webrtc/ {
    proxy_pass http://127.0.0.1:8889/;
    proxy_redirect / /webrtc/;
    proxy_buffering off;
  }

  # LL-HLS fallback. Long-polling playlist requests need buffering off.
  location /hls/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_redirect / /hls/;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}
